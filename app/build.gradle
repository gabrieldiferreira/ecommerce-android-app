plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt' // For annotation processing with Kotlin
    id 'com.google.dagger.hilt.android' // Hilt plugin
}

//navigation component: ProductListFragmentDirections
apply plugin: "androidx.navigation.safeargs.kotlin"

android {
    namespace 'com.renarosantos.ecommerceapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.renarosantos.ecommerceapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    android {
        viewBinding.enabled = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.9.1")
    implementation 'androidx.navigation:navigation-fragment:2.9.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation("androidx.activity:activity-ktx:1.9.0")

    //Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.6.1'

    //coroutines
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")

    //Serializantion
    implementation 'com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:0.8.0'
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"

    // Hilt
    implementation "com.google.dagger:hilt-android:2.51.1" // Or your latest Hilt version
    kapt "com.google.dagger:hilt-android-compiler:2.51.1" // Or your latest Hilt version

    // Hilt for AndroidX ViewModel integration
    implementation "androidx.hilt:hilt-navigation-fragment:1.2.0" // For Fragments
    // or for Activities: implementation "androidx.hilt:hilt-lifecycle-viewmodel:1.0.0-alpha03" (older, use androidx.hilt:hilt-navigation-fragment instead)
    kapt "androidx.hilt:hilt-compiler:1.2.0" // For hilt-navigation-fragment/hilt-lifecycle-viewmodel


    //Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    //navigation component: ProductListFragmentDirections
    implementation("androidx.navigation:navigation-fragment-ktx:2.9.0")
    implementation("androidx.navigation:navigation-ui-ktx:2.9.0")

}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}